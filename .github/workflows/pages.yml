name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A3DDC7: ${{ secrets.A3DDC7 }}
          B988B4: ${{ secrets.B988B4 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A3DDC7', '')
          bm = os.environ.get('B988B4', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 553d43d365b345907289649fe261b7e8753eb21304df25 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 836d6da2b135c8c777d824375b -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
